# [DRED] of rulesmd.ini. It does not pick targets itself (CanPassiveAquire=no) and fires in any direction (OmniFire).
# Its missiles leave from PrimaryFireFLH 30,43,92, the second as far to the other side.
dred:
	Inherits: ^Ship
	Inherits@MC: ^MindControllable
	Buildable:
		Queue: Ship
		BuildPaletteOrder: 50
		Prerequisites: natech, ~nayard
		Description: actor-dred.description
	Valued:
		Cost: 2000
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Tooltip:
		Name: actor-dred.name
	Selectable:
		Bounds: 1448, 3861, 0, -289
	Health:
		HP: 800
	Armor:
		Type: Heavy
	Mobile:
		TurnSpeed: 4
		Speed: 60
	RevealsShroud:
		Range: 7c0
	Armament@primary:
		Weapon: DredLauncher
		LocalOffset: 154,220,471, 154,-220,471
	AttackFrontal:
		Voice: Attack
		FacingTolerance: 512
	MissileSpawnerParent:
		Actors: dmisl, dmisl
		RespawnTicks: 80
		LoadedCondition: loaded
	FireWarheadsOnDeath:
		Weapon: UnitExplode
		EmptyWeapon: UnitExplode
	WithVoxelBody:
