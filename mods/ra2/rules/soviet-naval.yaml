	WithVoxelBody@EMPTY:
		Sequence: empty
		RequiresCondition: !loaded
	Voiced:
		VoiceSet: SovietNavalVoice
	RenderSprites:
	HitShape:

# [DMISL] of rulesmd.ini, flown with [General] DMisl*: speed 18% is 46 leptons a frame (x4), Altitude 768 and
# BodyLength 128 leptons (x4), Acceleration 0.8 leptons a frame (x4), ROT 4 (x4).
dmisl:
	Inherits: v3rocket
	Tooltip:
		Name: actor-dmisl-name
	Rocket:
		PauseTicks: 20
		TiltTicks: 60
		PitchInitial: 0
		PitchFinal: 0.5
		TurnRate: 0.08
		Acceleration: 3.2
		Speed: 184
		CruiseAltitude: 3c0
		BodyLength: 512
		LazyCurve: false
		TurnSpeed: 16
		Weapon: DredMissile
		EliteWeapon: DredMissileE
